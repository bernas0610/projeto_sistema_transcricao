spring.application.name=transcricao

spring.datasource.url=jdbc:postgresql://localhost:5432/transcricao
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

app.armazenamento.diretorio=./uploads

app.ffmpeg.caminho=ffmpeg
app.ffmpeg.duracao-parte-segundos=900
app.ffmpeg.timeout-minutos=30

app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-3.5-flash
app.gemini.timeout-minutos=20

app.gemini.prompt=Transcreva integralmente e literalmente toda a fala deste áudio, em português do Brasil, do início ao fim. Não resuma e não omita trechos. Inclua as falas de todos os participantes. Se um trecho estiver inaudível, escreva [inaudível] em vez de inventar. Não acrescente nada depois do fim do áudio. Responda apenas com a transcrição, sem marcas de tempo.


app.processamento.threads=1