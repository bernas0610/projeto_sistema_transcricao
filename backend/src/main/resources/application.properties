spring.application.name=transcricao

spring.datasource.url=jdbc:postgresql://localhost:5432/transcricao
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

app.armazenamento.diretorio=${APP_UPLOAD_DIR:../uploads}

app.ffmpeg.caminho=ffmpeg
app.ffmpeg.duracao-parte-segundos=900
app.ffmpeg.timeout-minutos=30

app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-3.5-flash
app.gemini.timeout-minutos=20

app.gemini.prompt=Transcreva integralmente e literalmente toda a fala deste \u00e1udio, em portugu\u00eas do Brasil, do in\u00edcio ao fim. N\u00e3o resuma e n\u00e3o omita trechos. Inclua as falas de todos os participantes. Se um trecho estiver inaud\u00edvel, escreva [inaud\u00edvel] em vez de inventar. N\u00e3o acrescente nada depois do fim do \u00e1udio. Responda apenas com a transcri\u00e7\u00e3o, sem marcas de tempo.


app.processamento.threads=1

app.uso.limite-arquivos-diario=5
app.uso.fuso=America/Sao_Paulo
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_PASSWORD:}
