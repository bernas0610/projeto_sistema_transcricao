<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title description">
  <title id="title">Voz em Flor</title>
  <desc id="description">Transforme voz em palavras que ficam. Identidade em tons de ameixa e rosa.</desc>
  <defs>
    <linearGradient id="rose" x2="1" y2="1"><stop stop-color="#d28ba8"/><stop offset="1" stop-color="#a17bb7"/></linearGradient>
    <clipPath id="rounded"><rect width="1200" height="290" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="290" fill="#fcfafc"/>
    <rect width="344" height="290" fill="#25202c"/>
    <circle cx="1190" cy="0" r="175" fill="#f7eaf1"/>
    <circle cx="1190" cy="0" r="117" fill="#f2e2ec"/>
    <rect x="42" y="59" width="48" height="48" rx="14" fill="url(#rose)"/>
    <path d="M66 92 55 81c-8-10 4-17 11-9 7-8 19-1 11 9Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <text x="42" y="152" fill="#fff5fb" font-family="Georgia,serif" font-size="37" font-weight="bold">Voz em Flor</text>
    <text x="43" y="183" fill="#b5a3bc" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">ÁUDIO EM PALAVRAS</text>
    <g stroke="#c392ad" stroke-width="5" stroke-linecap="round">
      <path d="M45 230v8m12-17v26m12-34v42m12-34v26m12-19v12m12-8v4m12-12v20m12-31v42m12-35v28m12-22v16m12-12v8"/>
    </g>
    <text x="411" y="65" fill="#a76a88" font-family="Arial,sans-serif" font-size="11" letter-spacing="2.5">PARA O QUE VALE A PENA GUARDAR</text>
    <text x="409" y="130" fill="#302a37" font-family="Georgia,serif" font-size="49" font-weight="bold">Transforme voz em</text>
    <text x="409" y="190" fill="#ac6e8c" font-family="Georgia,serif" font-size="49" font-weight="bold" font-style="italic">palavras que ficam.</text>
    <text x="411" y="236" fill="#8b8392" font-family="Arial,sans-serif" font-size="15">Grave. Transcreva. Guarde.</text>
  </g>
</svg>
